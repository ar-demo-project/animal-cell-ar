<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Camera AR Demo</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0b1420;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;color:#fff}#camera{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;background:#111;transform:scaleX(-1)}#overlay{position:fixed;inset:0;pointer-events:none}#character{position:absolute;left:50%;top:43%;width:min(62vw,300px);aspect-ratio:1;transform:translate(-50%,-50%);filter:drop-shadow(0 14px 8px #0008);animation:float 2.8s ease-in-out infinite}.head{position:absolute;left:24%;top:18%;width:52%;height:45%;border-radius:48% 48% 43% 43%;background:#ffd83f;border:4px solid #a87920}.body{position:absolute;left:29%;top:53%;width:42%;height:30%;border-radius:48%;background:#ffc72f;border:4px solid #a87920}.ear{position:absolute;top:0;width:19%;height:34%;background:#ffd83f;border:4px solid #a87920;clip-path:polygon(50% 0,100% 100%,0 100%);border-radius:50% 50% 15% 15%}.ear.left{left:24%;transform:rotate(-25deg)}.ear.right{right:24%;transform:rotate(25deg)}.eye{position:absolute;top:39%;width:10%;aspect-ratio:1;border-radius:50%;background:#18334d}.eye.left{left:38%}.eye.right{right:38%}.cheek{position:absolute;top:62%;width:15%;aspect-ratio:1;border-radius:50%;background:#e85b4d}.cheek.left{left:24%}.cheek.right{right:24%}.mouth{position:absolute;left:43%;top:63%;width:14%;height:8%;border-bottom:4px solid #18334d;border-radius:50%}.label{position:absolute;left:50%;top:87%;transform:translateX(-50%);white-space:nowrap;font-weight:900;text-shadow:0 2px 4px #000}.panel{position:fixed;left:14px;right:14px;bottom:14px;padding:16px;border-radius:18px;background:#071321dd;backdrop-filter:blur(10px)}h1{margin:0 0 5px;font-size:1.4rem}.sub{margin:0 0 12px;color:#c7d7e8;font-size:.9rem}.status{font-weight:750;margin:8px 0 12px}.dot{display:inline-block;width:10px;height:10px;margin-right:7px;border-radius:50%;background:#f0b54d}.dot.ok{background:#58cb86}.dot.error{background:#ef6a68}button{width:100%;min-height:48px;border:0;border-radius:12px;background:#2783de;color:white;font:inherit;font-weight:800}#stop{display:none;margin-top:9px;background:#df5b5b}body.running #start{display:none}body.running #stop{display:block}body.running h1,body.running .sub{display:none}@keyframes float{50%{transform:translate(-50%,calc(-50% - 8px))}}
</style>
</head>
<body>
<video id="camera" autoplay playsinline muted></video>
<div id="overlay"><div id="character" hidden><div class="ear left"></div><div class="ear right"></div><div class="head"><div class="eye left"></div><div class="eye right"></div><div class="cheek left"></div><div class="cheek right"></div><div class="mouth"></div></div><div class="body"></div><div class="label">3D DEMO OBJECT</div></div></div>
<div class="panel"><h1>CAMERA AR DEMO</h1><p class="sub">This lightweight demo places a 3D-style object over the live camera view.</p><div class="status"><span id="dot" class="dot"></span><span id="status">Camera is off</span></div><button id="start">START CAMERA AR</button><button id="stop">STOP</button></div>
<script>
const video=document.querySelector('#camera'), character=document.querySelector('#character'), statusEl=document.querySelector('#status'), dot=document.querySelector('#dot');let stream=null;
function status(text,type=''){statusEl.textContent=text;dot.className='dot '+type}
async function start(){if(!window.isSecureContext){status('Open this GitHub Pages HTTPS link.','error');return}try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}},audio:false});video.srcObject=stream;character.hidden=false;document.body.classList.add('running');status('Camera on — demo object displayed.','ok')}catch(e){status('Camera permission was denied or unavailable.','error');console.error(e)}}
function stop(){stream?.getTracks().forEach(t=>t.stop());stream=null;video.srcObject=null;character.hidden=true;document.body.classList.remove('running');status('Camera is off')}
document.querySelector('#start').onclick=start;document.querySelector('#stop').onclick=stop;
</script>
</body></html>
